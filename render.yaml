# Render Infrastructure-as-Code spec.
# Push this file with the repo and the "Deploy to Render" flow picks it up.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: voicemail-greeting
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render injects PORT automatically; the Dockerfile defaults to 3000
      # when unset. NODE_ENV is set to production in the image.
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Optional: a server-side Cartesia key so the /api/voices catalog
      # can populate even before a visitor pastes their own key.
      # The audio-generation flow always uses the BYO key from the request.
      - key: CARTESIA_API_KEY
        sync: false
